<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<title>Сіянко Алла Василівна — цифровий методичний хаб</title>
<style>
/* Усі кольори беруться зі змінних теми (див. THEMES у скрипті) */
:root{--a0:var(--p);--a1:var(--sun);--a2:var(--rose);--a3:var(--sky)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:16px/1.55 "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px);
background:radial-gradient(circle at 12% 8%,var(--b1) 0,transparent 38%),radial-gradient(circle at 90% 15%,var(--b2) 0,transparent 40%),radial-gradient(circle at 60% 95%,var(--b3) 0,transparent 45%),var(--base)}
.orb{position:fixed;border-radius:50%;filter:blur(40px);opacity:.45;z-index:0;animation:fl 14s ease-in-out infinite alternate}
.o1{width:280px;height:280px;background:var(--sun);top:-60px;left:-60px}.o2{width:340px;height:340px;background:var(--sky);right:-90px;top:30%;animation-delay:-5s}.o3{width:260px;height:260px;background:var(--p);left:30%;bottom:-120px;animation-delay:-9s}
@keyframes fl{to{transform:translate(40px,-30px) scale(1.15)}}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:26px;box-shadow:0 14px 40px var(--sh)}
.pad{padding:22px}
/* перемикач: використовується для меню, підсторінок, фільтрів і вкладок */
.seg{display:flex;gap:6px;overflow-x:auto;padding:6px;border-radius:22px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--edge);box-shadow:0 8px 30px var(--sh);margin:0 0 18px}
.seg button{flex:1 0 auto;border:0;background:transparent;font:inherit;font-weight:600;font-size:.92rem;padding:10px 16px;border-radius:16px;color:var(--deep);cursor:pointer;white-space:nowrap;transition:.3s}
.seg button:hover{background:var(--chip)}
.seg button[aria-selected=true]{background:linear-gradient(135deg,var(--p),var(--p2));color:var(--on);box-shadow:0 6px 16px var(--sh)}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.dots button{width:24px;height:24px;border-radius:50%;border:2px solid #fff;cursor:pointer;box-shadow:0 2px 6px var(--sh)}
.dots button[aria-pressed=true]{outline:2px solid var(--deep);outline-offset:2px}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:6px 16px 20px}
h1{font-size:clamp(1.9rem,5vw,3.1rem);line-height:1.1;color:var(--deep)}
h2{font-size:clamp(1.5rem,3.6vw,2.2rem);color:var(--deep)}
h3{font-size:1.08rem;color:var(--deep)}
.bh{margin:26px 0 12px}
.lead{max-width:62ch;margin:6px 0 18px;color:var(--txt)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.tile{padding:22px;cursor:pointer;background:linear-gradient(145deg,var(--chip),color-mix(in srgb,var(--c) 70%,transparent))}
.t{transition:transform .25s ease,box-shadow .3s;will-change:transform}
.t.press{transform:perspective(700px) translateZ(-30px) rotateX(6deg) scale(.96)!important}
.ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:1.6rem;margin-bottom:12px;background:var(--c);box-shadow:0 8px 18px var(--sh)}
.tile p{font-size:.93rem;color:var(--txt);margin-top:6px}
.tg{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--edge);border-radius:99px;font-size:.78rem;font-weight:700;padding:3px 11px;margin-bottom:8px;color:var(--deep)}
.tg::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tc,var(--p))}
.hint{font-size:.8rem;color:var(--p);margin-top:12px;font-weight:700}
.go{border:0;font:inherit;font-weight:700;color:var(--on);background:linear-gradient(135deg,var(--p),var(--p2));padding:12px 22px;border-radius:16px;cursor:pointer;box-shadow:0 8px 20px var(--sh);transition:.3s;text-decoration:none;display:inline-block}
.go:hover{transform:translateY(-2px)}
.go.o{background:var(--chip);color:var(--deep);border:1px solid var(--edge);box-shadow:none}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.pager .go{max-width:48%;font-size:.9rem}
.hero{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:30px;padding:26px;align-items:center}
.photo{border-radius:22px;overflow:hidden;aspect-ratio:2/3;box-shadow:0 20px 40px var(--sh)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chips span{background:var(--chip);padding:6px 14px;border-radius:99px;font-size:.88rem;border:1px solid var(--edge)}
.prob{border-left:5px solid var(--sun);background:var(--chip);padding:12px 16px;border-radius:0 16px 16px 0;font-weight:600;color:var(--deep)}
.prob small{display:block;font-weight:400;color:var(--txt)}
.mods{margin-top:22px}.mods .tile ul{list-style:none;margin-top:10px;font-size:.88rem}.mods li{padding:2px 0;color:var(--txt)}
.bar{height:9px;border-radius:9px;background:var(--chip);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--p),var(--sun));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.frame{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:var(--chip)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:20px;color:var(--txt)}
.ph input{width:min(420px,78vw);padding:10px 14px;border-radius:12px;border:1px solid var(--edge);background:var(--chip);color:var(--ink);font:inherit}
.pn{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.85rem;color:var(--txt)}
.chart{display:flex;gap:14px;align-items:flex-end}
.col{flex:1;text-align:center;font-size:.85rem}
.bars{height:200px;display:flex;align-items:flex-end;justify-content:center;gap:6px;border-bottom:2px solid var(--edge)}
.bars i{flex:1;max-width:34px;height:0;border-radius:8px 8px 0 0;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative}
.bars em{position:absolute;top:-20px;left:0;right:0;font-size:.75rem;font-style:normal}
.lg{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.88rem;align-items:center}.lg u{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.demo{background:var(--sun);color:#2b2000;border-radius:6px;font-size:.75rem;font-weight:700;padding:1px 8px}
.acc{margin-bottom:12px;overflow:hidden}
.acc>button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;padding:16px 22px;cursor:pointer;font-weight:700}
.acc>button:focus-visible{outline:3px solid var(--sun);outline-offset:-3px}
.yr{color:var(--p);font-size:1.15rem}.ch{margin-left:auto;transition:transform .3s;font-size:1.3rem}.open .ch{transform:rotate(180deg)}
.now{background:var(--p);color:var(--on);border-radius:99px;font-size:.75rem;padding:2px 10px;font-style:normal}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}.open .bd{grid-template-rows:1fr}.bd>div{overflow:hidden}
.in{padding:0 22px 22px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.in div{background:var(--chip);border-radius:16px;padding:12px 14px;font-size:.88rem;color:var(--txt)}.in b{display:block;color:var(--deep)}
.ov{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(10,30,40,.5);backdrop-filter:blur(4px)}
.ov.on{display:flex;animation:vin .3s}@keyframes vin{from{opacity:0}}
.modal{position:relative;max-width:700px;width:100%;max-height:88vh;overflow:auto;padding:28px;background:var(--solid);animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(20px) scale(.96);opacity:0}}
.modal h3{font-size:1.4rem;margin:6px 44px 8px 0}.modal p,.modal li{color:var(--txt);margin-top:6px}.modal ul,.modal ol{padding-left:20px}
.modal iframe{width:100%;height:420px;border:1px solid var(--edge);border-radius:14px;margin-top:14px}
.dz{margin-top:16px;border:2px dashed var(--edge);border-radius:16px;padding:14px;font-size:.88rem;color:var(--txt)}
.x{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:2px solid var(--deep);background:var(--chip);color:var(--deep);font-size:26px;line-height:1;cursor:pointer;transition:.25s}
.x:hover{background:var(--deep);color:var(--solid);transform:rotate(90deg)}
.route{stroke-dasharray:700;stroke-dashoffset:700;animation:dr 2.6s .4s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.pt{position:fixed;pointer-events:none;z-index:99;border-radius:50%;width:10px;height:10px}
.ring{position:fixed;pointer-events:none;z-index:99;border:3px solid var(--p);border-radius:50%;transform:translate(-50%,-50%);animation:rg .8s ease-out forwards}
@keyframes rg{from{width:0;height:0;opacity:.9}to{width:130px;height:130px;opacity:0}}
footer{position:relative;z-index:1;text-align:center;font-size:.85rem;color:var(--txt);padding:0 16px 30px}
body.lock{overflow:hidden}
@media(max-width:720px){.hero{grid-template-columns:1fr;text-align:center}.photo{max-width:260px;margin:auto}.chips{justify-content:center}.prob{text-align:left}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.route{stroke-dashoffset:0}}
header{position:sticky;top:0;z-index:30;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));max-width:1100px;margin:auto}
.bar-top{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:6px;border-radius:22px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--edge);box-shadow:0 8px 30px var(--sh)}
.prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--p),var(--sun));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stage{position:relative}
/* Іконки Feather (вбудовані SVG) */
.fi{width:1em;height:1em;flex:none;display:block}
.ic{color:var(--deep)}
.chips .fi,h2 .fi{display:inline-block;vertical-align:-.15em}
/* фільтр сертифікатів */
.seg.wrap{flex-wrap:wrap;overflow:visible}
.seg button small{opacity:.65;margin-left:4px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:var(--txt);padding:28px}

/* ═══ ГОЛОВНА: оновлене оформлення ═══ */
h1,.sh h2,.rcard h3.rt{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
header .bar-top{gap:10px}
.topnav{flex:none;display:flex;gap:2px}
.topnav a{padding:8px 13px;border-radius:14px;font-weight:600;font-size:.88rem;color:var(--deep);text-decoration:none;white-space:nowrap;transition:.25s}
.topnav a:hover{background:var(--chip)}
.topnav a[aria-current]{background:linear-gradient(135deg,var(--p),var(--p2));color:var(--on);box-shadow:0 6px 16px var(--sh)}
@media(max-width:1020px){.topnav{display:none}}
.hero2{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(230px,350px) 1fr;gap:clamp(24px,5vw,56px);align-items:center;padding:clamp(22px,4vw,46px);border-radius:38px;box-shadow:0 34px 80px var(--sh),0 8px 22px var(--sh)}
.hero2::before{content:"";position:absolute;width:460px;height:460px;right:-150px;top:-190px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sun) 45%,transparent),transparent 68%);pointer-events:none}
.hero2::after{content:"";position:absolute;width:380px;height:380px;left:-160px;bottom:-200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--p2) 35%,transparent),transparent 68%);pointer-events:none}
.hero2>*{position:relative;z-index:1}
.hphoto{position:relative;padding-bottom:18px}
.pframe{padding:9px;border-radius:32px;background:linear-gradient(145deg,var(--chip),color-mix(in srgb,var(--p2) 35%,var(--chip)));box-shadow:0 26px 54px var(--sh),0 0 0 1px var(--edge)}
.pframe img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 16%;border-radius:24px}
.badge{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:9px 18px;border-radius:99px;font-size:.82rem;font-weight:800;color:var(--deep);background:var(--solid);border:1px solid var(--edge);box-shadow:0 10px 24px var(--sh)}
.badge .fi{color:var(--p)}
.htext h1{margin:6px 0 4px;letter-spacing:-.01em}
.htext h1 span{display:block;color:var(--p)}
.role{font-size:clamp(1.05rem,2.2vw,1.3rem);font-weight:700;color:var(--deep);margin-top:12px}
.org{color:var(--txt);font-size:.95rem;margin-top:2px}
.welcome{margin:24px 0 26px;padding:18px 22px;border-left:5px solid var(--sun);border-radius:0 20px 20px 0;background:var(--chip);box-shadow:0 8px 22px var(--sh);max-width:60ch}
.welcome p{color:var(--ink);font-size:1.02rem;line-height:1.65}
.welcome q{display:block;margin-top:10px;font-family:Georgia,serif;font-style:italic;color:var(--deep);quotes:"«" "»"}
.htext .prob{margin:0 0 24px;max-width:60ch;border-radius:0 20px 20px 0;box-shadow:0 8px 22px var(--sh)}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.cta .go{padding:14px 28px;font-size:1.02rem}
.sec{scroll-margin-top:96px}
.sh{display:flex;align-items:center;gap:14px;margin:64px 0 8px}
.sh .ic{margin:0;flex:none}
.sh h2{margin:0;line-height:1.1}
.sh+.lead{margin-bottom:22px}
.rgrid{display:grid;grid-template-columns:minmax(250px,320px) 1fr;gap:22px;align-items:start}
.rcard{padding:26px;border-radius:30px}
.rside{display:grid;gap:22px;position:sticky;top:96px}
.rside .rcard{background:linear-gradient(170deg,var(--glass),color-mix(in srgb,var(--c0) 55%,var(--glass)))}
.rcard h3.rt{display:flex;align-items:center;gap:10px;font-size:1.2rem;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid color-mix(in srgb,var(--p) 18%,transparent)}
.rcard h3.rt .fi{color:var(--p)}
.rmain{display:grid;gap:22px}
.ci{display:flex;gap:12px;align-items:flex-start;padding:7px 0;font-size:.93rem;color:var(--ink);word-break:break-word}
.ci .fi{margin-top:3px;color:var(--p);width:1.1em;height:1.1em}
.ci a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--p)}
.edu b{display:block;color:var(--deep)}.edu small{display:block;color:var(--txt);margin-top:3px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills span{background:var(--chip);border:1px solid var(--edge);border-radius:99px;padding:6px 13px;font-size:.85rem;font-weight:600;color:var(--deep);box-shadow:0 3px 8px var(--sh)}
.rmain p.pf{color:var(--ink);line-height:1.7;font-size:1.01rem}
.tl{position:relative;margin-left:8px;padding-left:26px;border-left:2px solid color-mix(in srgb,var(--p) 28%,transparent);display:grid;gap:22px}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-35px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--p);border:3px solid var(--solid);box-shadow:0 0 0 2px var(--p)}
.tl .when{display:inline-block;font-size:.78rem;font-weight:800;color:var(--p);background:var(--chip);border:1px solid var(--edge);border-radius:99px;padding:2px 12px;margin-bottom:6px}
.tl h4{font-size:1.05rem;color:var(--deep);line-height:1.3}
.tl .where{color:var(--txt);font-size:.9rem;margin:2px 0 8px}
.tl ul,.bl{list-style:none;padding:0;display:grid;gap:7px}
.tl li,.bl li{position:relative;padding-left:20px;color:var(--ink);font-size:.93rem;line-height:1.55}
.tl li::before,.bl li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--sun)}
details.cert summary{cursor:pointer;font-weight:700;color:var(--deep);list-style:none;display:flex;align-items:center;gap:10px}
details.cert summary::-webkit-details-marker{display:none}
details.cert summary::after{content:"⌄";margin-left:auto;font-size:1.3rem;transition:transform .3s}
details.cert[open] summary::after{transform:rotate(180deg)}
details.cert .bl{margin-top:14px}
.embed .efr{position:relative;border-radius:22px;overflow:hidden;background:var(--chip);min-height:220px;resize:vertical}
.embed .efr iframe{display:block;width:100%;height:520px;border:0;background:#fff}
.embed .ed{display:grid;gap:12px;padding:22px;text-align:left}
.embed textarea{width:100%;min-height:150px;resize:vertical;padding:14px;border-radius:16px;border:1px solid var(--edge);background:var(--chip);color:var(--ink);font:.85rem/1.5 ui-monospace,Menlo,Consolas,monospace}
.embed .ed b{color:var(--deep)}
.embed .ed span{font-size:.88rem;color:var(--txt)}
.embed .btns{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:860px){.rgrid{grid-template-columns:1fr}.rside{position:static}}
@media(max-width:720px){.hero2{grid-template-columns:1fr;text-align:center;border-radius:30px}.hphoto{max-width:290px;margin:auto}.welcome{margin-inline:auto;text-align:left}.cta{justify-content:center}.sh{margin-top:48px}}

.embed{width:100vw;margin-left:calc(50% - 50vw);padding:0!important;background:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;backdrop-filter:none!important}
.embed .efr{border-radius:0;background:none;resize:none;min-height:0}
.embed .efr iframe{height:calc(100vh - 96px);min-height:640px;background:transparent}
.embed .pn{max-width:1100px;margin:10px auto 0;padding:0 18px}
.embed .ed{max-width:760px;margin:0 auto}

/* головна: заголовок угорі, фото по центру */
.hero2{display:flex!important;flex-direction:column;align-items:center;text-align:center;gap:26px!important;padding:clamp(26px,4vw,52px)!important}
.htitle{max-width:880px}
.htitle h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.08;color:var(--deep);margin:12px 0 10px}
.htitle .role{font-size:clamp(1.1rem,2.6vw,1.55rem);color:var(--p);margin-top:6px}
.htitle .org{font-size:1.02rem;margin-top:6px}
.hero2 .hphoto{width:min(300px,70vw);padding-bottom:0}
.hbody{width:100%;max-width:720px;display:grid;justify-items:center}
.hbody .welcome,.hbody .prob{text-align:left;width:100%;max-width:none}
.hbody .cta{justify-content:center}
.hero2 .hbody .prob{margin:0 0 26px}

/* заголовок угорі головної */
main .htop{position:static;max-width:900px;margin:10px auto 0;padding:8px 8px 0;text-align:center}
.htop h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;color:var(--deep);letter-spacing:-.01em}
.htop .role{font-size:clamp(1.05rem,2.3vw,1.4rem);font-weight:700;color:var(--p);margin-top:8px}
.htop .org{color:var(--txt);font-size:1rem;margin-top:4px}
.htop+.sec .embed .efr iframe{height:max(680px,calc(100vh - 230px))}

.att .al{display:grid;gap:12px;margin:12px 0}
.att .fr{background:var(--chip);border:1px solid var(--edge);border-radius:16px;padding:12px;display:grid;gap:10px}
.att .fn{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.att .fn b{color:var(--deep);word-break:break-all}
.att .fn span{display:flex;gap:8px;flex-wrap:wrap}
.att .fn .go{padding:7px 14px;font-size:.82rem}
.att img{display:block;max-width:100%;border-radius:12px;box-shadow:0 8px 20px var(--sh)}
.att .fr iframe{height:380px;margin:0}
.att label.up{cursor:pointer;margin:2px 0 8px}
.att small{display:block;color:var(--txt)}

.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.go.sm{padding:8px 14px;font-size:.84rem;border-radius:13px}
.cd{display:grid;gap:8px;margin-top:12px}

<style id="methodika-floating-geometry">
/* Делікатні геометричні фігури лише на сторінці «Методика».

.methodika-floaters{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  display:none;contain:layout paint;
}

  position:absolute;bottom:-100px;left:var(--x);width:var(--size);height:var(--size);
  border:1px solid rgba(148,174,225,.34);
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(163,190,241,.025));

  opacity:0;animation:methodika-rise var(--duration) linear var(--delay) infinite;
  will-change:transform,opacity;
}

}

const MEM=[];let _db=null;
const idb=()=>_db?Promise.resolve(_db):new Promise((res,rej)=>{try{const r=indexedDB.open("portfolio-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>res(_db=r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{const t=db.transaction("f",mode),st=t.objectStore("f"),q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
async function fAll(b){try{return(await tx("readonly",st=>st.getAll())).filter(x=>x.block===b)}catch(e){return MEM.filter(x=>x.block===b)}}
async function fAdd(b,f){try{await tx("readwrite",st=>st.add({block:b,name:f.name,type:f.type,blob:f}))}catch(e){MEM.push({id:MEM.length+1e6,block:b,name:f.name,type:f.type,blob:f})}}
async function fDel(id){try{await tx("readwrite",st=>st.delete(id))}catch(e){const i=MEM.findIndex(x=>x.id==id);i>=0&&MEM.splice(i,1)}}
